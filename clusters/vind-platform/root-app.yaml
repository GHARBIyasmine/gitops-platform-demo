apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: root-app
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/GHARBIyasmine/gitops-platform-demo.git
    targetRevision: main
    path: apps
    directory:
      recurse: true
      exclude: '{guestbook/**,platform/cilium-policies/**}'
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      selfHeal: true
      prune: true