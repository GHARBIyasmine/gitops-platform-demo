apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: guestbook-prod 
  namespace: argocd          
spec:
  project: default            
  source:
    repoURL: https://github.com/GHARBIyasmine/gitops-platform-demo.git
    targetRevision: main
    path: apps/guestbook/overlays/prod
  destination:
    server: https://prod.vc-prod
    namespace: guestbook
  syncPolicy:
  # In the prod environment, we want to be more careful about what gets deployed especially in early adoption of GitOps. So we will not enable self-healing, and we will not enable pruning. 
  # This means that if a resource is deleted from the Git repo, it will not be automatically deleted from the cluster. This is a safety measure to prevent accidental deletions in production or introducing breaking changes suddenly.
    syncOptions:
      - CreateNamespace=true   