apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: guestbook-staging
  namespace: argocd          
spec:
  project: default            
  source:
    repoURL: https://github.com/GHARBIyasmine/gitops-platform-demo.git
    targetRevision: main
    path: apps/guestbook/overlays/staging
  destination:
    server: https://staging.vc-staging
    namespace: guestbook
  syncPolicy:
    automated:
      prune: true
    syncOptions:
      - CreateNamespace=true   