apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: platform-policies
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/GHARBIyasmine/gitops-platform-demo.git
    targetRevision: main
    path: apps/platform/cilium-policies
  destination:
    server: https://kubernetes.default.svc   
    namespace: default                        
  syncPolicy:
    automated:
      selfHeal: true
      prune: true
    syncOptions:
      - CreateNamespace=true